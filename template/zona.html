<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061031">
<link rel="icon" type="image/webp" href="/assets/mark.webp">
<title>{{nombre}} · Información ampliada de la zona · PropHero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--navy:#061031;--navy-d:#03081F;--navy-l:#2A46B8;--blue:#0D35F0;--blue-l:#7D96FB;--blue-mid:#3355F5;--body:#4B5771;--muted:#8B93A6;--cream:#F4F6FB;--cream-d:#E7ECF7;--rule:#DCE2EF;--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:#fff;color:var(--body);font-family:var(--font);font-size:clamp(15px,1.05vw,16px);line-height:1.65;font-variant-numeric:tabular-nums;overflow-wrap:break-word}
b,strong{font-weight:600;color:var(--navy)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{color:var(--navy);font-weight:600;letter-spacing:-.03em;line-height:1.14}
h1{font-size:clamp(32px,5vw,52px);margin:0}h2{font-size:clamp(26px,3.2vw,38px);margin:0 0 16px;max-width:26ch}h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 14px}
h1,h2,h3,p,td,th,.l{overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(18px,5vw,64px)}
.wrap>*,.two>*,.kpis>*,.clocks>*,.sizes>*,.b>*,.y>*{min-width:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{color:var(--navy);line-height:0;margin-right:auto}.logo svg{height:24px;width:auto}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:10px 18px;border-radius:999px;text-decoration:none;background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1px var(--rule)}
.btn:hover{box-shadow:inset 0 0 0 1px var(--navy)}
.head{background:var(--cream);padding:48px 0 36px;border-bottom:1px solid var(--rule)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--blue);margin:0 0 14px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--blue);border-radius:2px}
section{padding:64px 0}
section.mist{background:var(--cream)}
.label{font-size:14px;font-weight:600;color:var(--blue);margin:0 0 12px}
.narrow{max-width:66ch}
.muted{color:var(--body)}
.small{font-size:14px}
.tw{overflow-x:auto;margin:20px 0}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:11px 12px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td{color:var(--navy)}
th{font-size:12.5px;font-weight:600;color:var(--body);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
td.n{font-weight:600}
td .sub{display:block;font-size:13px;color:var(--body);margin-top:3px;font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
@media (max-width:880px){.two{grid-template-columns:1fr;gap:32px}}
.quote{margin:44px 0 0;padding:30px 34px;border-radius:20px;background:var(--navy);color:#fff;font-size:clamp(21px,2.4vw,28px);font-weight:600;line-height:1.3;letter-spacing:-.02em;position:relative;overflow:hidden}
.quote::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--blue)}
.quote small{display:block;font-size:14px;font-weight:400;color:#C7CEE6;margin-top:12px;letter-spacing:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:36px 0}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpi{border:1px solid var(--rule);border-radius:16px;padding:22px;background:#fff}
.kpi b{display:block;font-weight:600;color:var(--navy);font-size:32px;line-height:1.05;letter-spacing:-.03em}
.kpi span{display:block;font-size:14px;color:var(--body);margin-top:10px;line-height:1.45}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.kpis.k3{grid-template-columns:1fr}}
.map svg{width:100%;height:auto;display:block}
.map text{font-family:var(--font);font-size:13px;fill:var(--navy);font-weight:600}
.map .km{font-size:12px;fill:var(--body);font-weight:500}
.zchart svg{width:100%;height:auto;display:block}
.zchart text{font-family:var(--font);font-size:12px;fill:var(--body)}
.bars{display:grid;gap:14px;margin:26px 0 12px}
.b{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:center}
.b .l{font-size:15px;font-weight:600;color:var(--navy);line-height:1.3}
.b .l small{display:block;font-weight:400;color:var(--body);font-size:13px}
.b .track{height:40px;border-radius:10px;background:#fff;border:1px solid var(--rule)}
.b .fill{height:100%;border-radius:10px;background:var(--cream-d);color:var(--navy);display:flex;align-items:center;justify-content:flex-end;padding:0 14px;font-weight:600;font-size:14px;min-width:max-content}
.b.cy .fill{background:var(--blue);color:#fff}
.b.mg .fill{background:var(--navy);color:#fff}
.b.hl .l{color:var(--blue)}
@media (max-width:640px){.b{grid-template-columns:1fr;gap:6px}}
.yield{display:grid;gap:12px;margin:0 0 24px}
.y{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:center}
.y .l{font-weight:600;color:var(--navy)}
.y .track{height:50px;border-radius:12px;background:var(--cream)}
.y .fill{height:100%;border-radius:12px;background:var(--cream-d);color:var(--navy);display:flex;align-items:center;justify-content:flex-end;padding:0 16px;font-weight:600;font-size:18px}
.y.us .fill{background:var(--blue);color:#fff}
@media (max-width:640px){.y{grid-template-columns:1fr;gap:6px}}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:36px}
.size{border-radius:20px;padding:30px;background:var(--navy);color:#C7CEE6}
.size.alt{background:#fff;color:var(--body);border:1px solid var(--rule)}
.size b{display:block;font-size:clamp(52px,6.5vw,80px);font-weight:600;line-height:1;letter-spacing:-.04em;color:#fff}
.size.alt b{color:var(--blue)}
.size b small{font-size:.38em;font-weight:500;letter-spacing:0}
.size p{margin:16px 0 0;font-size:15px}
@media (max-width:760px){.sizes{grid-template-columns:1fr}}
.clocks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:36px}
.clock{border:1px solid var(--rule);border-radius:18px;padding:26px;background:#fff}
.clock .ctag{font-size:13px;font-weight:600;color:var(--blue);margin:0 0 10px}
.clock p{font-size:15px;margin:0}
@media (max-width:880px){.clocks{grid-template-columns:1fr}}
@media (max-width:520px){.kpi b{font-size:28px}.quote{padding:24px 22px;font-size:20px}.size{padding:24px}.bar .btn span{display:none}}
.zsub{padding:64px 0}
footer{background:var(--navy-d);color:#A3ABC4;font-size:13px;padding:26px 0}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer svg{height:20px;width:auto;color:#fff}
</style>
</head>
